<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code changelog</title>
<meta name="description" content="Every Claude Code release: new commands, flags, and key changes. Updated daily.">
<link rel="alternate" type="application/atom+xml" title="Claude Code changelog" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Continuous-form listing paper: green bars, feed holes, black ink, red for what is new. */
  :root {
    color-scheme: light;
    --desk: #dfe4da;
    --paper: #fbfcf7;
    --bar: #e4f0e1;
    --rule: #a9c8ab;
    --ink: #17262b;
    --ink-soft: #55676a;
    --red: #c2311f;
    --marker: #ffe45c;
    --sans: 'IBM Plex Sans', 'IBM Plex Sans KR', system-ui, sans-serif;
    --cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans KR', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', ui-monospace, monospace;
    --strip: 34px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --desk: #070b09;
      --paper: #0e1512;
      --bar: #14211a;
      --rule: #2f4a3a;
      --ink: #d9e6da;
      --ink-soft: #8ba294;
      --red: #ff7a66;
      --marker: #6b5a00;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-padding-top: 9rem; }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.55; color: var(--ink); background: var(--desk); }
  a { color: inherit; text-underline-offset: 0.18em; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .sheet { position: relative; max-width: 1080px; min-height: 100vh; margin: 0 auto; background: var(--paper); padding: 0 var(--strip); }
  .sheet::before, .sheet::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: var(--strip);
    background: radial-gradient(circle, var(--desk) 0 5px, transparent 5.6px) center top / var(--strip) 42px repeat-y;
  }
  .sheet::before { left: 0; border-right: 1px dashed var(--rule); }
  .sheet::after { right: 0; border-left: 1px dashed var(--rule); }
  .pad { padding-left: 1.75rem; padding-right: 1.75rem; }

  /* listing header line, as printed at the top of a job */
  .jobline { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding-top: 0.9rem; padding-bottom: 0.6rem; border-bottom: 1px dashed var(--rule); font: 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); }
  .jobline > span { white-space: nowrap; }

  header { padding-top: 2.5rem; padding-bottom: 2.25rem; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  h1 { font-family: var(--cond); font-weight: 700; font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.05; letter-spacing: -0.01em; }
  .star { flex-shrink: 0; font: 500 0.8rem var(--mono); text-decoration: none; border: 1.5px solid var(--ink); padding: 0.3rem 0.65rem; white-space: nowrap; transition: background 0.15s, color 0.15s; }
  .star:hover { background: var(--ink); color: var(--paper); }
  .star b { font-weight: 600; margin-left: 0.5rem; padding-left: 0.55rem; border-left: 1.5px solid currentColor; }
  .star b:empty { display: none; }
  .latest { display: inline-block; margin-top: 1.4rem; font: 600 clamp(3.6rem, 14vw, 8.75rem)/0.92 var(--mono); letter-spacing: -0.055em; text-decoration: none; min-height: 0.92em; }
  .latest:hover { color: var(--red); }
  .facts { margin-top: 1.1rem; max-width: 46rem; font-size: 1.05rem; color: var(--ink-soft); }
  .facts b { font-family: var(--mono); font-weight: 600; color: var(--ink); }

  /* the page prints itself once: the version is struck character by character, then the paper feeds */
  .latest.print { animation: print 0.85s steps(var(--n, 7)) both; }
  .facts.print { animation: settle 0.5s 0.8s both; }
  .rel.feed { animation: feed 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 50ms + var(--base, 0ms)); }
  .rel.feed .stamp { animation: stamp 0.28s cubic-bezier(0.3, 1.5, 0.5, 1) both; animation-delay: calc(var(--i, 0) * 50ms + var(--base, 0ms) + 0.4s); }
  .rel-main.unfold li, .rel-main.unfold .group-title { animation: line 0.22s both; animation-delay: calc(min(var(--l, 0), 26) * 16ms); }
  @keyframes print { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes settle { from { opacity: 0; transform: translateY(6px); } }
  @keyframes feed { from { opacity: 0; transform: translateY(22px); } }
  @keyframes stamp { from { opacity: 0; transform: rotate(-3deg) scale(2.4); } }
  @keyframes line { from { opacity: 0; transform: translateX(-8px); } }
  @media (prefers-reduced-motion: reduce) {
    .latest.print, .facts.print, .rel.feed, .rel.feed .stamp, .rel-main.unfold li, .rel-main.unfold .group-title { animation: none; }
  }

  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--paper); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); padding-top: 0.6rem; padding-bottom: 0.6rem; }
  .bar-row { display: flex; align-items: center; gap: 0.5rem 1.25rem; flex-wrap: wrap; }
  .bar-row + .bar-row { margin-top: 0.55rem; }
  .tabs { display: flex; gap: 1.1rem; }
  .tab, .lang, .type-btn, .more, .chip { font-family: var(--mono); font-size: 0.8rem; }
  .tab { text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); padding: 0.1rem 0; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .lang { margin-left: auto; text-decoration: underline; }
  .search-wrap { position: relative; flex: 1 1 100%; }
  #search { width: 100%; font: 500 0.95rem var(--mono); color: var(--ink); background: transparent; border: 1.5px solid var(--ink); border-radius: 0; padding: 0.5rem 2.4rem 0.5rem 0.75rem; outline-offset: 2px; }
  #search::placeholder { color: var(--ink-soft); font-weight: 400; }
  .kbd { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); font: 0.8rem var(--mono); color: var(--ink-soft); pointer-events: none; }
  #search:focus + .kbd, #search:not(:placeholder-shown) + .kbd { display: none; }
  #result-count { font: 0.8rem var(--mono); color: var(--ink-soft); margin-right: auto; }
  .check { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; cursor: pointer; user-select: none; }
  .check input { accent-color: var(--ink); }
  .types { display: flex; gap: 0.15rem; flex-wrap: wrap; }
  .type-btn { padding: 0.1rem 0.45rem; }
  .type-btn::before { content: attr(data-mark) ' '; font-weight: 600; }
  .type-btn:hover { text-decoration: underline; }
  .type-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  body.view-commands .versions-only { display: none; }

  /* one release per bar */
  .rel { display: grid; grid-template-columns: 10.5rem minmax(0, 1fr); gap: 0 1.5rem; padding: 1.1rem 1.75rem 1.2rem; }
  .rel:nth-child(odd) { background: var(--bar); }
  .rel-side { cursor: pointer; align-self: start; }
  .ver { display: block; font: 600 1.3rem/1.2 var(--mono); letter-spacing: -0.02em; text-decoration: none; }
  .ver:hover { text-decoration: underline; }
  .rel:target .ver { background: var(--marker); }
  .rel time, .tally { display: block; font: 0.78rem var(--mono); color: var(--ink-soft); }
  .rel time { margin-top: 0.25rem; }
  .tally { word-spacing: 0.35em; }

  .intro { font: 500 0.85rem var(--mono); color: var(--red); margin-bottom: 0.45rem; display: flex; flex-wrap: wrap; gap: 0.1rem 0.9rem; align-items: baseline; }
  .stamp { font-weight: 600; letter-spacing: 0.14em; border: 2px solid var(--red); padding: 0.05rem 0.4rem; font-size: 0.72rem; transform: rotate(-3deg); }
  .chip { overflow-wrap: anywhere; text-align: left; }
  .chip:hover { text-decoration: underline; }
  .chip.new { color: var(--red); font-weight: 500; }
  .chip.removed { text-decoration: line-through; }

  .rel-main ul { list-style: none; }
  .rel-main li { position: relative; padding-left: 1.5rem; margin-bottom: 0.3rem; overflow-wrap: anywhere; }
  .rel-main li::before { content: attr(data-mark); position: absolute; left: 0; font: 600 0.95rem/1.6 var(--mono); }
  .rel-main li code { font: 500 0.88em var(--mono); }
  mark { background: var(--marker); color: inherit; }
  .group-title { font: 600 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); margin: 0.9rem 0 0.35rem; }
  .group-title:first-child, .intro + .group-title { margin-top: 0; }
  .more { margin-top: 0.35rem; text-decoration: underline; color: var(--ink-soft); }
  .more:hover { color: var(--ink); }
  .rel-foot { margin-top: 0.9rem; padding-top: 0.6rem; border-top: 1px dashed var(--rule); display: flex; flex-wrap: wrap; gap: 0.15rem 0.9rem; align-items: baseline; font-size: 0.8rem; }
  .foot-label { font: 600 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); }
  .rel-foot a { font: 0.8rem var(--mono); }
  .rel-foot .more { margin: 0 0 0 auto; }

  /* command index */
  .cmd-section h2 { font: 600 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); padding: 1.4rem 1.75rem 0.5rem; }
  .cmd-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.5fr) 6.5rem 6rem; gap: 0 1rem; align-items: baseline; padding: 0.3rem 1.75rem; font: 0.82rem var(--mono); }
  .cmd-row:nth-of-type(odd) { background: var(--bar); }
  .cmd-first, .cmd-date, .cmd-count { color: var(--ink-soft); }
  .cmd-count { text-align: right; }

  .empty { padding: 3.5rem 1.75rem; }
  .empty p { font-size: 1.05rem; }
  .empty .more { margin-top: 0.6rem; }

  footer { border-top: 2px solid var(--ink); margin-top: 2rem; padding-top: 1rem; padding-bottom: 2.5rem; font: 0.78rem/1.7 var(--mono); color: var(--ink-soft); }

  @media (max-width: 760px) {
    :root { --strip: 0px; }
    .sheet::before, .sheet::after { display: none; }
    .pad, .rel, .cmd-row, .cmd-section h2, .empty { padding-left: 1rem; padding-right: 1rem; }
    header { padding-top: 1.75rem; }
    .jobline > span:nth-child(2) { display: none; }
    html { scroll-padding-top: 11rem; }
    .rel { grid-template-columns: minmax(0, 1fr); }
    .rel-side { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.9rem; margin-bottom: 0.5rem; }
    .rel time { margin-top: 0; }
    #search { font-size: 16px; }
    .kbd { display: none; }
    .cmd-row { grid-template-columns: minmax(0, 1fr) auto; }
    .cmd-date { display: none; }
    .cmd-first { grid-column: 1; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="jobline pad">
    <span>claude-code / changelog.md</span>
    <span id="job-count"></span>
    <span><span data-i18n="job_updated">updated</span> <span id="updated">—</span></span>
  </div>
  <header class="pad">
    <div class="head-row">
      <h1>Claude Code changelog</h1>
      <a class="star" href="https://github.com/tryumanshow/claude-code-changelog" target="_blank" rel="noopener">&#9733; Star<b id="star-count"></b></a>
    </div>
    <a class="latest" id="latest" href="#"></a>
    <p class="facts" id="facts">&nbsp;</p>
  </header>

  <div class="toolbar pad">
    <div class="bar-row">
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-view="versions" data-i18n="tab_versions">Releases</button>
        <button class="tab" type="button" role="tab" data-view="commands" data-i18n="tab_commands">Commands</button>
      </div>
      <button class="lang" id="lang-toggle" type="button">한국어</button>
    </div>
    <div class="bar-row">
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Find a version, command or change" data-i18n-placeholder="search_placeholder" autocomplete="off" spellcheck="false" aria-label="Search">
        <span class="kbd">/</span>
      </div>
    </div>
    <div class="bar-row">
      <span id="result-count" aria-live="polite"></span>
      <label class="check versions-only"><input type="checkbox" id="only-new"> <span data-i18n="only_new">Only releases with a new command</span></label>
      <span class="types versions-only" id="types">
        <button class="type-btn" type="button" data-type="new" data-mark="+" data-i18n="type_new">added</button>
        <button class="type-btn" type="button" data-type="improved" data-mark="~" data-i18n="type_improved">improved</button>
        <button class="type-btn" type="button" data-type="fixed" data-mark="*" data-i18n="type_fixed">fixed</button>
        <button class="type-btn" type="button" data-type="removed" data-mark="-" data-i18n="type_removed">removed</button>
      </span>
    </div>
  </div>

  <main id="list" aria-busy="true"><div class="empty"><p data-i18n="loading">Loading the changelog…</p></div></main>
  <div id="sentinel"></div>
  <noscript><div class="empty"><p>This page needs JavaScript. The same data is in <a href="https://github.com/tryumanshow/claude-code-changelog/blob/main/RELEASES.md">RELEASES.md</a>.</p></div></noscript>

  <footer class="pad">
    <span data-i18n="foot_source">Parsed every day at 06:00 KST from</span> <a href="https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md">anthropics/claude-code CHANGELOG.md</a>.<br>
    <a href="feed.xml" data-i18n="foot_feed">Atom feed</a> &middot;
    <a href="https://github.com/tryumanshow/claude-code-changelog" data-i18n="foot_repo">Source on GitHub</a> &middot;
    <a href="https://github.com/tryumanshow">@tryumanshow</a>
  </footer>
</div>

<script>
(function () {
  'use strict';

  const I18N = {
    en: {
      tab_versions: 'Releases', tab_commands: 'Commands', toggle_label: '한국어',
      search_placeholder: 'Find a version, command or change', only_new: 'Only releases with a new command',
      type_new: 'added', type_improved: 'improved', type_fixed: 'fixed', type_removed: 'removed', type_mentioned: 'other',
      facts: (total, withNew, date) => ['Latest release' + (date ? `, ${date}. ` : '. '), `${total}`, ' releases on record; ', `${withNew}`, ' of them introduced a command.'],
      job_updated: 'updated', job_count: n => `${n} releases`,
      loading: 'Loading the changelog…', load_failed: 'The changelog data did not load. Reload the page to try again.',
      count_all: n => `${n} releases`, count_some: (n, total) => `${n} of ${total} releases`,
      empty: 'No release matches that.', cmd_empty: 'No command matches that.', clear: 'Clear search and filters',
      more: n => `${n} more`, collapse: 'Fold', stamp: 'NEW',
      commands: 'Commands in this release', official: 'Official changelog',
      filter_by: name => `Find releases that mention ${name}`,
      kind_slash: 'Slash commands', kind_flag: 'CLI flags', kind_key: 'Keyboard shortcuts',
      introduced: 'introduced in', first_mention: 'first mentioned in',
      cmd_count_all: n => `${n} commands`, cmd_count_some: (n, total) => `${n} of ${total} commands`,
      in_versions: n => n === 1 ? '1 release' : `${n} releases`,
      foot_source: 'Parsed every day at 06:00 KST from',
      foot_feed: 'Atom feed', foot_repo: 'Source on GitHub',
    },
    ko: {
      tab_versions: '릴리스', tab_commands: '커맨드', toggle_label: 'English',
      search_placeholder: '버전, 커맨드, 변경 내용 찾기', only_new: '새 커맨드가 나온 릴리스만',
      type_new: '추가', type_improved: '개선', type_fixed: '수정', type_removed: '삭제', type_mentioned: '기타',
      facts: (total, withNew, date) => ['최신 릴리스' + (date ? ` (${date}). ` : '. ') + '지금까지 ', `${total}`, '개가 기록됐고, 그중 ', `${withNew}`, '개에서 새 커맨드가 나왔어요.'],
      job_updated: '업데이트', job_count: n => `릴리스 ${n}개`,
      loading: 'changelog 불러오는 중…', load_failed: '데이터를 불러오지 못했어요. 새로고침해 주세요.',
      count_all: n => `릴리스 ${n}개`, count_some: (n, total) => `${total}개 중 ${n}개`,
      empty: '조건에 맞는 릴리스가 없어요.', cmd_empty: '조건에 맞는 커맨드가 없어요.', clear: '검색과 필터 지우기',
      more: n => `${n}개 더`, collapse: '접기', stamp: 'NEW',
      commands: '이 릴리스의 커맨드', official: '공식 changelog',
      filter_by: name => `${name} 이 언급된 릴리스 찾기`,
      kind_slash: '슬래시 커맨드', kind_flag: 'CLI 플래그', kind_key: '단축키',
      introduced: '처음 추가', first_mention: '처음 언급',
      cmd_count_all: n => `커맨드 ${n}개`, cmd_count_some: (n, total) => `${total}개 중 ${n}개`,
      in_versions: n => `릴리스 ${n}개`,
      foot_source: '매일 오전 6시(KST)에 파싱하는 원본:',
      foot_feed: 'Atom 피드', foot_repo: 'GitHub 에서 소스 보기',
    },
  };
  const MARKS = { new: '+', improved: '~', fixed: '*', removed: '-', mentioned: '·' };
  const TYPES = ['new', 'improved', 'fixed', 'removed', 'mentioned'];
  const PREVIEW = 3;          // bullets shown while a version is collapsed
  const MATCH_PREVIEW = 8;    // matching bullets shown while searching
  const PAGE = 30;            // versions rendered per scroll step

  const $ = id => document.getElementById(id);
  const list = $('list'), search = $('search'), onlyNew = $('only-new');

  const params = new URLSearchParams(location.search);
  const state = {
    q: params.get('q') || '',
    onlyNew: params.get('new') === '1',
    type: TYPES.includes(params.get('type')) ? params.get('type') : '',
    view: params.get('view') === 'commands' ? 'commands' : 'versions',
    lang: params.get('lang') || readPref('cc-lang') || 'en',
    open: new Set(),
    shown: PAGE,
  };
  if (!I18N[state.lang]) state.lang = 'en';

  let releases = [];      // from data.json
  let ko = null;          // from ko.json, loaded on demand
  let filtered = [];
  let t = I18N[state.lang];

  function readPref(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function writePref(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // --- data -----------------------------------------------------------------
  function featureText(rel, i) {
    if (state.lang === 'ko' && ko && ko[rel.version] && ko[rel.version][i]) return ko[rel.version][i];
    return rel.features[i].text;
  }
  function typeOk(feature) { return !state.type || feature.type === state.type; }
  function tokens() { return state.q.toLowerCase().split(/\s+/).filter(Boolean); }

  // A version matches when every token is found in its version, date, commands or bullets.
  function matchRelease(rel, toks) {
    const head = `v${rel.version} ${rel.date} ${rel.commands.map(c => c.name).join(' ')}`.toLowerCase();
    const texts = rel.features.map((f, i) => typeOk(f) ? featureText(rel, i).toLowerCase() : '');
    if (!toks.every(tok => head.includes(tok) || texts.some(x => x.includes(tok)))) return null;
    const hits = [];
    texts.forEach((x, i) => { if (x && toks.some(tok => x.includes(tok))) hits.push(i); });
    return hits;
  }

  function applyFilters() {
    const toks = tokens();
    filtered = [];
    for (const rel of releases) {
      if (state.onlyNew && !rel.hasNew) continue;
      if (state.type && !rel.features.some(typeOk)) continue;
      const hits = toks.length ? matchRelease(rel, toks) : [];
      if (hits) filtered.push({ rel, hits });
    }
  }

  // --- rendering ------------------------------------------------------------
  // Text with command names wrapped in <code> and search tokens in <mark>, built from text nodes only.
  function renderText(parent, text, rel, toks) {
    const cmdCtx = new Map(rel.commands.map(c => [c.name.toLowerCase(), c.context]));
    const cmdAlt = rel.commands.map(c => escapeRe(c.name)).sort((a, b) => b.length - a.length).join('|');
    const tokAlt = toks.map(escapeRe).sort((a, b) => b.length - a.length).join('|');
    const parts = [];
    if (cmdAlt) parts.push(`(?<![\\w/:-])(?:${cmdAlt})(?![\\w-])`);
    if (tokAlt) parts.push(`(?:${tokAlt})`);
    if (!parts.length) { parent.textContent = text; return; }
    const re = new RegExp(parts.join('|'), 'gi');
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (!m[0]) { re.lastIndex++; continue; }
      if (m.index > last) parent.append(text.slice(last, m.index));
      if (cmdCtx.has(m[0].toLowerCase())) {
        const code = el('code');
        markInto(code, m[0], toks);
        parent.append(code);
      } else {
        parent.append(el('mark', null, m[0]));
      }
      last = m.index + m[0].length;
    }
    if (last < text.length) parent.append(text.slice(last));
  }
  function markInto(parent, text, toks) {
    const tok = toks.find(x => text.toLowerCase().includes(x));
    if (!tok) { parent.textContent = text; return; }
    const at = text.toLowerCase().indexOf(tok);
    parent.append(text.slice(0, at), el('mark', null, text.slice(at, at + tok.length)), text.slice(at + tok.length));
  }

  function bullet(rel, i, toks) {
    const li = el('li');
    li.dataset.mark = MARKS[rel.features[i].type];
    renderText(li, featureText(rel, i), rel, toks);
    return li;
  }

  function chip(cmd) {
    const b = el('button', `chip ${cmd.context}`, cmd.name);
    b.type = 'button';
    b.title = t.filter_by(cmd.name);
    b.dataset.cmd = cmd.name;
    return b;
  }

  function toggleButton(label, open) {
    const b = el('button', 'toggle more', label);
    b.type = 'button';
    b.setAttribute('aria-expanded', String(open));
    return b;
  }

  function renderBody(body, item, toks) {
    const rel = item.rel, open = state.open.has(rel.version);
    body.textContent = '';
    const fresh = rel.commands.filter(c => c.context === 'new');
    if (fresh.length) {
      const intro = el('p', 'intro');
      intro.append(el('span', 'stamp', t.stamp));
      fresh.forEach(c => intro.append(chip(c)));
      body.append(intro);
    }
    if (open) {
      for (const type of TYPES) {
        const idx = rel.features.map((f, i) => f.type === type ? i : -1).filter(i => i >= 0);
        if (!idx.length) continue;
        body.append(el('div', 'group-title', `${t['type_' + type]} (${idx.length})`));
        const ul = el('ul');
        idx.forEach(i => ul.append(bullet(rel, i, toks)));
        body.append(ul);
      }
      const foot = el('div', 'rel-foot');
      if (rel.commands.length) {
        foot.append(el('span', 'foot-label', t.commands));
        rel.commands.forEach(c => foot.append(chip(c)));
      }
      const link = el('a', null, t.official);
      link.href = `https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md#${rel.version.replace(/\./g, '')}`;
      link.target = '_blank'; link.rel = 'noopener';
      foot.append(link, toggleButton(t.collapse, true));
      body.append(foot);
      return;
    }
    const all = rel.features.map((f, i) => typeOk(f) ? i : -1).filter(i => i >= 0);
    const pick = item.hits.length ? item.hits.slice(0, MATCH_PREVIEW) : all.slice(0, state.type ? MATCH_PREVIEW : PREVIEW);
    const ul = el('ul');
    pick.forEach(i => ul.append(bullet(rel, i, toks)));
    body.append(ul);
    if (rel.features.length > pick.length) body.append(toggleButton(t.more(rel.features.length - pick.length), false));
  }

  function renderRelease(item, toks) {
    const rel = item.rel;
    const art = el('article', 'rel');
    art.id = 'v' + rel.version;
    art.dataset.version = rel.version;

    const side = el('div', 'rel-side');
    const ver = el('a', 'ver', rel.version);
    ver.href = '#v' + rel.version;
    side.append(ver);
    if (rel.date) { const time = el('time', null, rel.date); time.dateTime = rel.date; side.append(time); }
    const counts = TYPES.slice(0, 4)
      .map(type => [type, rel.features.filter(f => f.type === type).length])
      .filter(([, n]) => n);
    if (counts.length) {
      const tally = el('span', 'tally', counts.map(([type, n]) => MARKS[type] + n).join(' '));
      tally.title = counts.map(([type, n]) => `${t['type_' + type]} ${n}`).join(', ');
      side.append(tally);
    }

    const body = el('div', 'rel-main');
    renderBody(body, item, toks);
    art.append(side, body);
    return art;
  }

  // --- command index ----------------------------------------------------------
  let commandIndexCache = null;
  function commandIndex() {
    if (commandIndexCache) return commandIndexCache;
    const byName = new Map();
    for (let i = releases.length - 1; i >= 0; i--) {       // oldest first
      const rel = releases[i];
      for (const c of rel.commands) {
        let entry = byName.get(c.name);
        if (!entry) {
          const kind = c.name.startsWith('--') ? 'flag' : c.name.startsWith('/') ? 'slash' : 'key';
          entry = { name: c.name, kind, first: rel, introduced: c.context === 'new', order: i, count: 0 };
          byName.set(c.name, entry);
        }
        entry.count++;
      }
    }
    commandIndexCache = [...byName.values()].sort((a, b) => a.order - b.order);   // newest first
    return commandIndexCache;
  }

  function renderCommands() {
    const toks = tokens();
    const all = commandIndex();
    const shown = all.filter(c => toks.every(tok => c.name.toLowerCase().includes(tok)));
    list.textContent = '';
    list.setAttribute('aria-busy', 'false');
    $('result-count').textContent = shown.length === all.length
      ? t.cmd_count_all(all.length) : t.cmd_count_some(shown.length, all.length);
    if (!shown.length) { renderEmpty(t.cmd_empty); return; }
    for (const kind of ['slash', 'flag', 'key']) {
      const rows = shown.filter(c => c.kind === kind);
      if (!rows.length) continue;
      const section = el('section', 'cmd-section');
      section.append(el('h2', null, `${t['kind_' + kind]} (${rows.length})`));
      for (const c of rows) {
        const row = el('div', 'cmd-row');
        row.append(chip({ name: c.name, context: c.introduced ? 'new' : 'mentioned' }));
        const first = el('span', 'cmd-first');
        const link = el('a', null, c.first.version);
        link.href = '#v' + c.first.version;
        first.append((c.introduced ? t.introduced : t.first_mention) + ' ', link);
        row.append(first, el('span', 'cmd-date', c.first.date || ''), el('span', 'cmd-count', t.in_versions(c.count)));
        section.append(row);
      }
      list.append(section);
    }
  }

  function renderEmpty(message) {
    const empty = el('div', 'empty');
    empty.append(el('p', null, message));
    const clear = el('button', 'more', t.clear);
    clear.type = 'button'; clear.id = 'clear';
    empty.append(clear);
    list.append(empty);
  }

  function renderMore(feed) {
    const toks = tokens();
    const from = list.querySelectorAll('.rel').length;
    const frag = document.createDocumentFragment();
    filtered.slice(from, state.shown).forEach((item, i) => {
      const art = renderRelease(item, toks);
      if (feed && i < 10) { art.classList.add('feed'); art.style.setProperty('--i', i); }
      frag.append(art);
    });
    list.append(frag);
  }

  function render(feed) {
    document.body.classList.toggle('view-commands', state.view === 'commands');
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
    document.querySelectorAll('.type-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === state.type)));
    if (state.view === 'commands') { renderCommands(); return; }
    applyFilters();
    list.textContent = '';
    list.setAttribute('aria-busy', 'false');
    $('result-count').textContent = filtered.length === releases.length
      ? t.count_all(releases.length) : t.count_some(filtered.length, releases.length);
    if (!filtered.length) { renderEmpty(t.empty); return; }
    renderMore(feed);
  }

  // Header sentence; the odd-numbered parts are the figures.
  function renderFacts() {
    const latest = releases[0];
    if (!latest) return;
    const parts = t.facts(releases.length, releases.filter(r => r.hasNew).length, latest.date);
    const big = $('latest');
    big.textContent = latest.version;
    big.href = '#v' + latest.version;
    big.style.setProperty('--n', latest.version.length);
    $('job-count').textContent = t.job_count(releases.length);
    const facts = $('facts');
    facts.textContent = '';
    parts.forEach(part => facts.append(/^[\d.]+$/.test(part) ? el('b', null, part) : part));
  }

  function applyLang() {
    t = I18N[state.lang];
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t[n.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(n => { n.placeholder = t[n.dataset.i18nPlaceholder]; });
    $('lang-toggle').textContent = t.toggle_label;
    renderFacts();
  }

  function syncUrl() {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    if (state.onlyNew) p.set('new', '1');
    if (state.type) p.set('type', state.type);
    if (state.view === 'commands') p.set('view', 'commands');
    if (state.lang !== 'en') p.set('lang', state.lang);
    const qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
  }

  function update(resetScroll) {
    if (resetScroll) state.shown = PAGE;
    syncUrl();
    render();
  }

  function clearFilters() {
    state.q = ''; state.onlyNew = false; state.type = '';
    search.value = ''; onlyNew.checked = false;
  }

  // --- deep links -------------------------------------------------------------
  function goToHash() {
    const version = decodeURIComponent(location.hash).replace(/^#v/, '');
    if (!version || !releases.some(r => r.version === version)) return;
    state.view = 'versions';
    applyFilters();
    let idx = filtered.findIndex(item => item.rel.version === version);
    if (idx < 0) {            // hidden by the current filters: drop them
      clearFilters();
      applyFilters();
      idx = filtered.findIndex(item => item.rel.version === version);
    }
    state.open.add(version);
    state.shown = Math.max(state.shown, idx + 1);
    syncUrl();
    render();
    const node = $('v' + version);
    if (node) node.scrollIntoView({ block: 'start' });
  }

  // --- events -----------------------------------------------------------------
  let debounce;
  search.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = search.value.trim(); update(true); }, 120);
  });
  onlyNew.addEventListener('change', () => { state.onlyNew = onlyNew.checked; update(true); });

  $('lang-toggle').addEventListener('click', async () => {
    state.lang = state.lang === 'en' ? 'ko' : 'en';
    writePref('cc-lang', state.lang);
    applyLang();
    if (state.lang === 'ko') await loadKo();
    update(false);
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== search && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault(); search.focus(); search.select();
    } else if (e.key === 'Escape' && document.activeElement === search) {
      search.value = ''; state.q = ''; search.blur(); update(true);
    }
  });

  list.addEventListener('click', e => {
    if (e.target.id === 'clear') { clearFilters(); update(true); return; }
    const chipBtn = e.target.closest('.chip');
    if (chipBtn) {
      state.q = chipBtn.dataset.cmd; search.value = state.q;
      state.view = 'versions';
      update(true);
      window.scrollTo({ top: 0 });
      return;
    }
    if (e.target.closest('.rel-foot a')) return;
    const art = e.target.closest('.rel');
    if (!art) return;
    const isToggle = e.target.closest('.toggle') || e.target.closest('.rel-side');
    if (!isToggle || window.getSelection().toString()) return;
    if (e.target.closest('.ver')) e.preventDefault();
    const version = art.dataset.version;
    const opening = !state.open.has(version);
    if (opening) state.open.add(version); else state.open.delete(version);
    if (e.target.closest('.ver') && opening) history.replaceState(null, '', location.pathname + location.search + '#v' + version);
    const item = filtered.find(x => x.rel.version === version);
    const next = renderRelease(item, tokens());
    if (opening) {
      const main = next.querySelector('.rel-main');
      main.classList.add('unfold');
      main.querySelectorAll('.group-title, li').forEach((node, i) => node.style.setProperty('--l', i));
    }
    art.replaceWith(next);
  });

  $('types').addEventListener('click', e => {
    const btn = e.target.closest('.type-btn');
    if (!btn) return;
    state.type = state.type === btn.dataset.type ? '' : btn.dataset.type;
    update(true);
  });
  document.querySelector('.tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab || tab.dataset.view === state.view) return;
    state.view = tab.dataset.view;
    update(true);
  });

  window.addEventListener('hashchange', goToHash);

  new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && state.view === 'versions' && state.shown < filtered.length) {
      state.shown += PAGE;
      list.style.setProperty('--base', '0ms');
      renderMore(true);
    }
  }, { rootMargin: '600px' }).observe($('sentinel'));

  // --- boot -------------------------------------------------------------------
  async function loadKo() {
    if (ko) return;
    try {
      const res = await fetch('ko.json');
      if (!res.ok) throw new Error(res.status);
      ko = await res.json();
    } catch (e) {
      ko = {};   // bullets stay in English
    }
  }

  async function loadStars() {
    try {
      const res = await fetch('https://api.github.com/repos/tryumanshow/claude-code-changelog');
      if (res.ok) $('star-count').textContent = (await res.json()).stargazers_count;
    } catch (e) { /* the button works without a count */ }
  }

  async function boot() {
    applyLang();
    search.value = state.q;
    onlyNew.checked = state.onlyNew;
    try {
      const res = await fetch('data.json');
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      releases = data.releases;
      releases.forEach(r => { r.hasNew = r.commands.some(c => c.context === 'new'); });
      $('updated').textContent = data.updated;
    } catch (e) {
      list.textContent = '';
      const failed = el('div', 'empty');
      failed.append(el('p', null, t.load_failed));
      list.append(failed);
      return;
    }
    if (state.lang === 'ko') await loadKo();
    renderFacts();
    $('latest').classList.add('print');
    $('facts').classList.add('print');
    list.style.setProperty('--base', '650ms');     // let the header print first
    render(true);
    goToHash();
    loadStars();
  }
  boot();
})();
</script>
</body>
</html>
