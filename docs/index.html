<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Changelog</title>
<meta name="description" content="Every Claude Code release: new commands, flags, and key changes. Updated daily.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --surface: #141417;
    --surface-hover: #1a1a1f;
    --border: #27272a;
    --border-subtle: #1e1e22;
    --text: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --accent: #d4a574;
    --accent-dim: rgba(212,165,116,0.08);
    --accent-border: rgba(212,165,116,0.25);
    --new: #4ade80;
    --improved: #d4a574;
    --fixed: #60a5fa;
    --removed: #f87171;
    --mark: rgba(250,204,21,0.28);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface-hover: #f4f4f2;
      --border: #d6d3d1;
      --border-subtle: #e7e5e4;
      --text: #1c1917;
      --text-secondary: #44403c;
      --text-muted: #78716c;
      --accent: #9a5b22;
      --accent-dim: rgba(154,91,34,0.06);
      --accent-border: rgba(154,91,34,0.3);
      --new: #15803d;
      --improved: #9a5b22;
      --fixed: #1d4ed8;
      --removed: #b91c1c;
      --mark: rgba(250,204,21,0.45);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  code, .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  a { color: inherit; }
  .container { width: 100%; max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.5rem 1rem; flex: 1; }

  header { margin-bottom: 1.75rem; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
  .header-left { display: flex; align-items: center; gap: 0.75rem; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
  h1 .cc { color: var(--accent); }
  .pill {
    font-size: 0.7rem; font-weight: 500; padding: 0.25rem 0.6rem; border-radius: 100px;
    background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border);
  }
  .meta { color: var(--text-muted); font-size: 0.8rem; }
  .meta a { color: var(--text-secondary); text-decoration: none; }
  .meta a:hover { color: var(--accent); text-decoration: underline; }

  .stats { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
  .stat { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 0.85rem 1.25rem; flex: 1; min-width: 0; }
  .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .stat .label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.2rem; }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 1rem;
  }
  .toolbar-row { display: flex; gap: 0.75rem; align-items: center; }
  .search-wrap { position: relative; flex: 1; }
  #search {
    width: 100%; padding: 0.55rem 2.6rem 0.55rem 1rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 0.9rem; font-family: inherit; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-muted); }
  .kbd {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
    font-size: 0.7rem; color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 0.35rem; pointer-events: none;
  }
  #search:focus + .kbd, #search:not(:placeholder-shown) + .kbd { display: none; }
  .check { display: flex; align-items: center; gap: 0.4rem; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; white-space: nowrap; user-select: none; }
  .check input { accent-color: var(--accent); }
  .btn {
    padding: 0.4rem 0.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-secondary); font-size: 0.8rem; font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .status { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 0.55rem; font-size: 0.75rem; color: var(--text-muted); }
  .legend { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .legend span::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 0.35rem; background: currentColor; }

  .new { color: var(--new); }
  .improved { color: var(--improved); }
  .fixed { color: var(--fixed); }
  .removed { color: var(--removed); }
  .mentioned { color: var(--text-muted); }

  .rel { border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--surface); margin-bottom: 0.6rem; scroll-margin-top: 7rem; }
  .rel.has-new { border-left: 3px solid var(--accent); }
  .rel:target { border-color: var(--accent); }
  .rel-head { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; padding: 0.7rem 1rem; cursor: pointer; }
  .rel-head:hover { background: var(--surface-hover); border-radius: 10px; }
  .ver { font-weight: 600; font-size: 0.9rem; text-decoration: none; color: var(--text); }
  .ver:hover { color: var(--accent); }
  .rel time { font-size: 0.76rem; color: var(--text-muted); }
  .counts { display: flex; gap: 0.6rem; font-size: 0.74rem; font-weight: 500; }
  .newcmds { display: flex; gap: 0.3rem; flex-wrap: wrap; flex: 1; min-width: 0; }
  .chip {
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.74rem;
    padding: 0.1rem 0.45rem; border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary); cursor: pointer; overflow-wrap: anywhere;
  }
  .chip:hover { border-color: currentColor; }
  .chip.new { color: var(--new); border-color: color-mix(in srgb, var(--new) 40%, transparent); }
  .chip.improved { color: var(--improved); }
  .chip.fixed { color: var(--fixed); }
  .chip.removed { color: var(--removed); text-decoration: line-through; }
  .toggle { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-family: inherit; padding: 0.2rem 0.3rem; white-space: nowrap; }
  .toggle:hover { color: var(--accent); }

  .rel-body { padding: 0 1rem 0.8rem; }
  .group-title { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin: 0.7rem 0 0.3rem; }
  .rel-body ul { list-style: none; }
  .rel-body li { position: relative; padding-left: 1rem; margin-bottom: 0.25rem; color: var(--text-secondary); font-size: 0.82rem; line-height: 1.5; overflow-wrap: anywhere; }
  .rel-body li::before { content: ''; position: absolute; left: 0; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .rel-body li.new::before { background: var(--new); }
  .rel-body li.improved::before { background: var(--improved); }
  .rel-body li.fixed::before { background: var(--fixed); }
  .rel-body li.removed::before { background: var(--removed); }
  .rel-body li.mentioned::before { background: var(--text-muted); }
  .rel-body li code { font-size: 0.76rem; padding: 0.05rem 0.3rem; border-radius: 3px; background: color-mix(in srgb, currentColor 10%, transparent); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .more { margin-top: 0.2rem; padding-left: 1rem; }
  .rel-foot { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; margin-top: 0.8rem; padding-top: 0.7rem; border-top: 1px solid var(--border-subtle); }
  .rel-foot .foot-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-right: 0.3rem; }
  .rel-foot a { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); text-decoration: none; white-space: nowrap; }
  .rel-foot a:hover { color: var(--accent); }

  .empty { text-align: center; color: var(--text-muted); padding: 3rem 1rem; font-size: 0.9rem; }
  .empty .btn { margin-top: 0.9rem; }

  footer { border-top: 1px solid var(--border-subtle); padding: 1.5rem 2rem; text-align: center; color: var(--text-muted); font-size: 0.75rem; }
  footer a { color: var(--text-secondary); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 640px) {
    .container { padding: 1.25rem 0.9rem 1rem; }
    h1 { font-size: 1.25rem; }
    .stats { gap: 0.5rem; }
    .stat { padding: 0.65rem 0.75rem; }
    .stat .num { font-size: 1.05rem; }
    .stat .label { font-size: 0.58rem; }
    .toolbar-row { flex-wrap: wrap; }
    .search-wrap { flex-basis: 100%; }
    #search { font-size: 16px; }
    .kbd, .legend { display: none; }
    .rel-head { gap: 0.5rem; padding: 0.65rem 0.8rem; }
    .newcmds { flex-basis: 100%; order: 5; }
    .rel-body { padding: 0 0.8rem 0.7rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div class="header-left"><h1><span class="cc">Claude Code</span> Changelog</h1><span class="pill">AUTO-SYNC</span></div>
      <iframe src="https://ghbtns.com/github-btn.html?user=tryumanshow&amp;repo=claude-code-changelog&amp;type=star&amp;count=true&amp;size=large" frameborder="0" scrolling="0" width="120" height="30" title="GitHub Stars"></iframe>
    </div>
    <p class="meta">
      <span data-i18n="meta_checked">Checked daily at 06:00 KST</span> &middot;
      <span data-i18n="meta_updated">Last updated</span>: <span id="updated">—</span> &middot;
      <a href="https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md" data-i18n="meta_source">Source</a> &middot;
      <a href="https://github.com/tryumanshow/claude-code-changelog" data-i18n="meta_repo">Repo</a>
    </p>
  </header>

  <div class="stats">
    <div class="stat"><div class="num mono" id="stat-total">—</div><div class="label" data-i18n="stat_total">Total Versions</div></div>
    <div class="stat"><div class="num mono" id="stat-new">—</div><div class="label" data-i18n="stat_new">With New Commands</div></div>
    <div class="stat"><div class="num mono" id="stat-latest">—</div><div class="label" id="stat-latest-label" data-i18n="stat_latest">Latest Release</div></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-row">
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Search version, command, feature..." data-i18n-placeholder="search_placeholder" autocomplete="off" spellcheck="false" aria-label="Search">
        <span class="kbd mono">/</span>
      </div>
      <label class="check"><input type="checkbox" id="only-new"> <span data-i18n="only_new">New commands only</span></label>
      <button class="btn" id="lang-toggle" type="button">한국어</button>
    </div>
    <div class="status">
      <span id="result-count" aria-live="polite"></span>
      <span class="legend">
        <span class="new" data-i18n="type_new">Added</span>
        <span class="improved" data-i18n="type_improved">Improved</span>
        <span class="fixed" data-i18n="type_fixed">Fixed</span>
        <span class="removed" data-i18n="type_removed">Removed</span>
      </span>
    </div>
  </div>

  <main id="list" aria-busy="true"><p class="empty" data-i18n="loading">Loading…</p></main>
  <div id="sentinel"></div>
  <noscript><p class="empty">This page needs JavaScript. The same data is in <a href="https://github.com/tryumanshow/claude-code-changelog/blob/main/RELEASES.md">RELEASES.md</a>.</p></noscript>
</div>

<footer>
  Made by <a href="https://github.com/tryumanshow">@tryumanshow</a>
  &middot; Powered by GitHub Actions &middot;
  Data from <a href="https://github.com/anthropics/claude-code">anthropics/claude-code</a>
</footer>

<script>
(function () {
  'use strict';

  const I18N = {
    en: {
      meta_checked: 'Checked daily at 06:00 KST', meta_updated: 'Last updated', meta_source: 'Source', meta_repo: 'Repo',
      stat_total: 'Total Versions', stat_new: 'With New Commands', stat_latest: 'Latest Release',
      search_placeholder: 'Search version, command, feature...', only_new: 'New commands only',
      type_new: 'Added', type_improved: 'Improved', type_fixed: 'Fixed', type_removed: 'Removed', type_mentioned: 'Other',
      loading: 'Loading…', load_failed: 'Could not load the changelog data. Reload to try again.',
      count_all: n => `${n} versions`, count_some: (n, total) => `${n} of ${total} versions`,
      empty: 'No version matches.', clear: 'Clear filters',
      expand: 'Show all', collapse: 'Show less', more: n => `+ ${n} more`,
      commands: 'Commands', official: 'Official changelog ↗', toggle_label: '한국어',
      filter_by: name => `Search for ${name}`,
    },
    ko: {
      meta_checked: '매일 오전 6시(KST) 확인', meta_updated: '마지막 업데이트', meta_source: '소스', meta_repo: '저장소',
      stat_total: '전체 버전 수', stat_new: '새 커맨드가 나온 버전', stat_latest: '최신 릴리스',
      search_placeholder: '버전, 커맨드, 기능 검색...', only_new: '새 커맨드 있는 버전만',
      type_new: '추가', type_improved: '개선', type_fixed: '수정', type_removed: '삭제', type_mentioned: '기타',
      loading: '불러오는 중…', load_failed: '데이터를 불러오지 못했어요. 새로고침해 주세요.',
      count_all: n => `버전 ${n}개`, count_some: (n, total) => `${total}개 중 ${n}개`,
      empty: '조건에 맞는 버전이 없어요.', clear: '필터 지우기',
      expand: '전체 보기', collapse: '접기', more: n => `+ ${n}개 더`,
      commands: '커맨드', official: '공식 changelog ↗', toggle_label: 'English',
      filter_by: name => `${name} 검색`,
    },
  };
  const TYPES = ['new', 'improved', 'fixed', 'removed', 'mentioned'];
  const PREVIEW = 3;          // bullets shown while a version is collapsed
  const MATCH_PREVIEW = 8;    // matching bullets shown while searching
  const PAGE = 30;            // versions rendered per scroll step

  const $ = id => document.getElementById(id);
  const list = $('list'), search = $('search'), onlyNew = $('only-new');

  const params = new URLSearchParams(location.search);
  const state = {
    q: params.get('q') || '',
    onlyNew: params.get('new') === '1',
    lang: params.get('lang') || readPref('cc-lang') || 'en',
    open: new Set(),
    shown: PAGE,
  };
  if (!I18N[state.lang]) state.lang = 'en';

  let releases = [];      // from data.json
  let ko = null;          // from ko.json, loaded on demand
  let filtered = [];
  let t = I18N[state.lang];

  function readPref(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function writePref(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  // --- data -----------------------------------------------------------------
  function featureText(rel, i) {
    if (state.lang === 'ko' && ko && ko[rel.version] && ko[rel.version][i]) return ko[rel.version][i];
    return rel.features[i].text;
  }
  function tokens() { return state.q.toLowerCase().split(/\s+/).filter(Boolean); }

  // A version matches when every token is found in its version, date, commands or bullets.
  function matchRelease(rel, toks) {
    const head = `v${rel.version} ${rel.date} ${rel.commands.map(c => c.name).join(' ')}`.toLowerCase();
    const texts = rel.features.map((_, i) => featureText(rel, i).toLowerCase());
    if (!toks.every(tok => head.includes(tok) || texts.some(x => x.includes(tok)))) return null;
    const hits = [];
    texts.forEach((x, i) => { if (toks.some(tok => x.includes(tok))) hits.push(i); });
    return hits;
  }

  function applyFilters() {
    const toks = tokens();
    filtered = [];
    for (const rel of releases) {
      if (state.onlyNew && !rel.hasNew) continue;
      const hits = toks.length ? matchRelease(rel, toks) : [];
      if (hits) filtered.push({ rel, hits });
    }
  }

  // --- rendering ------------------------------------------------------------
  // Text with command names wrapped in <code> and search tokens in <mark>, built from text nodes only.
  function renderText(parent, text, rel, toks) {
    const cmdCtx = new Map(rel.commands.map(c => [c.name.toLowerCase(), c.context]));
    const cmdAlt = rel.commands.map(c => escapeRe(c.name)).sort((a, b) => b.length - a.length).join('|');
    const tokAlt = toks.map(escapeRe).sort((a, b) => b.length - a.length).join('|');
    const parts = [];
    if (cmdAlt) parts.push(`(?<![\\w/:-])(?:${cmdAlt})(?![\\w-])`);
    if (tokAlt) parts.push(`(?:${tokAlt})`);
    if (!parts.length) { parent.textContent = text; return; }
    const re = new RegExp(parts.join('|'), 'gi');
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (!m[0]) { re.lastIndex++; continue; }
      if (m.index > last) parent.append(text.slice(last, m.index));
      const ctx = cmdCtx.get(m[0].toLowerCase());
      if (ctx) {
        const code = el('code', ctx);
        markInto(code, m[0], toks);
        parent.append(code);
      } else {
        parent.append(el('mark', null, m[0]));
      }
      last = m.index + m[0].length;
    }
    if (last < text.length) parent.append(text.slice(last));
  }
  function markInto(parent, text, toks) {
    const tok = toks.find(x => text.toLowerCase().includes(x));
    if (!tok) { parent.textContent = text; return; }
    const at = text.toLowerCase().indexOf(tok);
    parent.append(text.slice(0, at), el('mark', null, text.slice(at, at + tok.length)), text.slice(at + tok.length));
  }

  function bullet(rel, i, toks) {
    const li = el('li', rel.features[i].type);
    renderText(li, featureText(rel, i), rel, toks);
    return li;
  }

  function chip(cmd) {
    const b = el('button', `chip ${cmd.context}`, cmd.name);
    b.type = 'button';
    b.title = t.filter_by(cmd.name);
    b.dataset.cmd = cmd.name;
    return b;
  }

  function renderBody(body, item, toks) {
    const rel = item.rel, open = state.open.has(rel.version);
    body.textContent = '';
    if (open) {
      for (const type of TYPES) {
        const idx = rel.features.map((f, i) => f.type === type ? i : -1).filter(i => i >= 0);
        if (!idx.length) continue;
        body.append(el('div', `group-title ${type}`, `${t['type_' + type]} · ${idx.length}`));
        const ul = el('ul');
        idx.forEach(i => ul.append(bullet(rel, i, toks)));
        body.append(ul);
      }
      const foot = el('div', 'rel-foot');
      if (rel.commands.length) {
        foot.append(el('span', 'foot-label', t.commands));
        rel.commands.forEach(c => foot.append(chip(c)));
      }
      const link = el('a', null, t.official);
      link.href = `https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md#${rel.version.replace(/\./g, '')}`;
      link.target = '_blank'; link.rel = 'noopener';
      foot.append(link);
      body.append(foot);
      return;
    }
    const all = rel.features.map((_, i) => i);
    const pick = item.hits.length ? item.hits.slice(0, MATCH_PREVIEW) : all.slice(0, PREVIEW);
    const ul = el('ul');
    pick.forEach(i => ul.append(bullet(rel, i, toks)));
    body.append(ul);
    if (rel.features.length > pick.length) {
      const more = el('button', 'toggle more', t.more(rel.features.length - pick.length));
      more.type = 'button';
      body.append(more);
    }
  }

  function renderRelease(item, toks) {
    const rel = item.rel, open = state.open.has(rel.version);
    const art = el('article', 'rel' + (rel.hasNew ? ' has-new' : ''));
    art.id = 'v' + rel.version;
    art.dataset.version = rel.version;

    const head = el('div', 'rel-head');
    const ver = el('a', 'ver mono', 'v' + rel.version);
    ver.href = '#v' + rel.version;
    head.append(ver);
    if (rel.date) { const time = el('time', 'mono', rel.date); time.dateTime = rel.date; head.append(time); }

    const counts = el('span', 'counts');
    for (const type of TYPES.slice(0, 4)) {
      const n = rel.features.filter(f => f.type === type).length;
      if (n) { const c = el('span', type, `${t['type_' + type]} ${n}`); counts.append(c); }
    }
    head.append(counts);

    const cmds = el('span', 'newcmds');
    rel.commands.filter(c => c.context === 'new').forEach(c => cmds.append(chip(c)));
    head.append(cmds);

    const toggle = el('button', 'toggle', open ? t.collapse : t.expand);
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(open));
    head.append(toggle);

    const body = el('div', 'rel-body');
    renderBody(body, item, toks);
    art.append(head, body);
    return art;
  }

  function renderMore() {
    const toks = tokens();
    const from = list.querySelectorAll('.rel').length;
    const frag = document.createDocumentFragment();
    filtered.slice(from, state.shown).forEach(item => frag.append(renderRelease(item, toks)));
    list.append(frag);
  }

  function render() {
    applyFilters();
    list.textContent = '';
    list.setAttribute('aria-busy', 'false');
    $('result-count').textContent = filtered.length === releases.length
      ? t.count_all(releases.length) : t.count_some(filtered.length, releases.length);
    if (!filtered.length) {
      const empty = el('div', 'empty');
      empty.append(el('p', null, t.empty));
      const clear = el('button', 'btn', t.clear);
      clear.type = 'button'; clear.id = 'clear';
      empty.append(clear);
      list.append(empty);
      return;
    }
    renderMore();
  }

  function applyLang() {
    t = I18N[state.lang];
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t[n.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(n => { n.placeholder = t[n.dataset.i18nPlaceholder]; });
    $('lang-toggle').textContent = t.toggle_label;
  }

  function syncUrl() {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    if (state.onlyNew) p.set('new', '1');
    if (state.lang !== 'en') p.set('lang', state.lang);
    const qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
  }

  function update(resetScroll) {
    if (resetScroll) state.shown = PAGE;
    syncUrl();
    render();
  }

  // --- deep links -------------------------------------------------------------
  function goToHash() {
    const version = decodeURIComponent(location.hash).replace(/^#v/, '');
    if (!version || !releases.some(r => r.version === version)) return;
    let idx = filtered.findIndex(item => item.rel.version === version);
    if (idx < 0) {            // hidden by the current filters: drop them
      state.q = ''; state.onlyNew = false;
      search.value = ''; onlyNew.checked = false;
      applyFilters();
      idx = filtered.findIndex(item => item.rel.version === version);
    }
    state.open.add(version);
    state.shown = Math.max(state.shown, idx + 1);
    syncUrl();
    render();
    const node = $('v' + version);
    if (node) node.scrollIntoView({ block: 'start' });
  }

  // --- events -----------------------------------------------------------------
  let debounce;
  search.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = search.value.trim(); update(true); }, 120);
  });
  onlyNew.addEventListener('change', () => { state.onlyNew = onlyNew.checked; update(true); });

  $('lang-toggle').addEventListener('click', async () => {
    state.lang = state.lang === 'en' ? 'ko' : 'en';
    writePref('cc-lang', state.lang);
    applyLang();
    if (state.lang === 'ko') await loadKo();
    update(false);
  });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== search && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault(); search.focus(); search.select();
    } else if (e.key === 'Escape' && document.activeElement === search) {
      search.value = ''; state.q = ''; search.blur(); update(true);
    }
  });

  list.addEventListener('click', e => {
    if (e.target.id === 'clear') {
      state.q = ''; state.onlyNew = false; search.value = ''; onlyNew.checked = false;
      update(true);
      return;
    }
    const chipBtn = e.target.closest('.chip');
    if (chipBtn) {
      state.q = chipBtn.dataset.cmd; search.value = state.q;
      update(true);
      window.scrollTo({ top: 0 });
      return;
    }
    if (e.target.closest('.rel-foot a')) return;
    const art = e.target.closest('.rel');
    if (!art) return;
    const isToggle = e.target.closest('.toggle') || e.target.closest('.rel-head');
    if (!isToggle || window.getSelection().toString()) return;
    if (e.target.closest('.ver')) e.preventDefault();
    const version = art.dataset.version;
    const opening = !state.open.has(version);
    if (opening) state.open.add(version); else state.open.delete(version);
    if (e.target.closest('.ver') && opening) history.replaceState(null, '', location.pathname + location.search + '#v' + version);
    const item = filtered.find(x => x.rel.version === version);
    art.replaceWith(renderRelease(item, tokens()));
  });

  window.addEventListener('hashchange', goToHash);

  new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && state.shown < filtered.length) {
      state.shown += PAGE;
      renderMore();
    }
  }, { rootMargin: '600px' }).observe($('sentinel'));

  // --- boot -------------------------------------------------------------------
  async function loadKo() {
    if (ko) return;
    try {
      const res = await fetch('ko.json');
      if (!res.ok) throw new Error(res.status);
      ko = await res.json();
    } catch (e) {
      ko = {};   // bullets stay in English
    }
  }

  async function boot() {
    applyLang();
    search.value = state.q;
    onlyNew.checked = state.onlyNew;
    try {
      const res = await fetch('data.json');
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      releases = data.releases;
      releases.forEach(r => { r.hasNew = r.commands.some(c => c.context === 'new'); });
      $('updated').textContent = data.updated;
    } catch (e) {
      list.textContent = '';
      list.append(el('p', 'empty', t.load_failed));
      return;
    }
    if (state.lang === 'ko') await loadKo();
    $('stat-total').textContent = releases.length;
    $('stat-new').textContent = releases.filter(r => r.hasNew).length;
    const latest = releases[0];
    if (latest) $('stat-latest').textContent = latest.date || 'v' + latest.version;
    render();
    goToHash();
  }
  boot();
})();
</script>
</body>
</html>
