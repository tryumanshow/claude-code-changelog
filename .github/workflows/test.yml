name: Tests

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest tests -q
